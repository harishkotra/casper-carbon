[package]
edition = "2021"
name = "casper_carbon"
version = "0.1.0"

[dependencies]
odra = { version = "=2.8.0", features = [], default-features = false }
odra-modules = { version = "=2.8.0", default-features = false }
odra-casper-wasm-env = { version = "=2.8.0", default-features = false }
num-traits = { version = "0.2", default-features = false, features = [] }

[dev-dependencies]
odra-test = { version = "=2.8.0", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "=2.8.0", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "=2.8.0", features = [], default-features = false }
odra-cli = { version = "=2.8.0", features = [], default-features = false }

[[bin]]
name = "casper_carbon_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "casper_carbon_build_schema"
path = "bin/build_schema.rs"
test = false

[[bin]]
name = "casper_carbon_cli"
path = "bin/cli.rs"
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
